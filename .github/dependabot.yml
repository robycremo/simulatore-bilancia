# Aggiornamenti automatici delle dipendenze: PR settimanali raggruppate (minor+patch insieme).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dipendenze]
    groups:
      minori:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dipendenze]
    groups:
      actions:
        patterns: ['*']
