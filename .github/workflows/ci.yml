name: CI

on:
  push:
    branches: [main]
  pull_request:

# La CI legge soltanto il repository: nessun permesso di scrittura per il token del workflow.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Percorso SDD (check-flow)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run check:flow -- --base origin/${{ github.base_ref }}
          else
            npm run check:flow
          fi

      - name: Contenuti pubblicabili (check-public)
        run: npm run check:public

      # La build precede i test: i test su intestazioni e cache servono la UI compilata.
      - run: npm run build

      - run: npm test

      - name: Vulnerabilità delle dipendenze (gravità high o superiore)
        run: npm audit --audit-level=high
