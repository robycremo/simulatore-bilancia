name: 🐞 Bug
description: Qualcosa non funziona come dovrebbe
labels: [bug]
body:
  - type: textarea
    id: cosa
    attributes:
      label: Cosa succede
      description: Descrivi il problema e, se c'è, il messaggio di errore esatto.
    validations:
      required: true
  - type: textarea
    id: atteso
    attributes:
      label: Cosa ti aspettavi
    validations:
      required: true
  - type: textarea
    id: passi
    attributes:
      label: Come riprodurlo
      placeholder: |
        1. Apri …
        2. Esegui …
        3. Vedi l'errore
  - type: input
    id: dove
    attributes:
      label: Dove
      description: Ambiente, postazione, server o linea (es. produzione, TST, PC pesatura linea 2)
  - type: dropdown
    id: impatto
    attributes:
      label: Impatto
      options:
        - Blocca la produzione
        - Rallenta il lavoro, c'è un'alternativa
        - Fastidio minore
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log, screenshot, dati di esempio
      description: Non incollare password, stringhe di connessione o dati personali.
